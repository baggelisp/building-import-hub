project_id = "building-import-hub"

[api]
# Ports offset from the defaults so this stack can run next to other local Supabase projects.
port = 55421
schemas = ["public"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17

[auth]
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080"]
# Self-service sign-up is off; scripts/provision-user.mjs creates accounts.
enable_signup = false
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true

[functions.import-buildings]
# The function verifies the caller's JWT itself (supabase.auth.getClaims), which works with
# Supabase's asymmetric signing keys; the gateway check only understands the legacy secret.
verify_jwt = false

[studio]
port = 55423

[inbucket]
port = 55424

[analytics]
port = 55427

[db.pooler]
port = 55429
