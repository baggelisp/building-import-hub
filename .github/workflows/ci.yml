name: CI

# Runs on every pull request; on main it runs as the first stage of deploy.yml.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Public values only. The build inlines them into the bundle, and the CSP step needs the URL.
env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  web:
    name: Web app (format, lint, types, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.21.0 # the lockfile is npm 11's
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Built bundle contains no secret keys
        run: |
          if grep -rEo 'sb_secret_[A-Za-z0-9_-]{16,}|eyJhbGciOi[A-Za-z0-9._-]{40,}' dist/client; then
            echo "::error::A secret key was inlined into the frontend bundle"; exit 1
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: site
          path: dist/client
          retention-days: 7

  edge-function:
    name: Edge Function (deno check, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: 2.9.6
      - run: deno check import-buildings/index.ts import-buildings/evals/mapping.eval.ts
      - run: deno lint
      - name: Vendored SheetJS matches its checksum
        working-directory: supabase/functions/_shared/vendor/xlsx-0.20.3
        run: sha256sum -c SHA256SUMS

  database:
    name: Database (migrations from scratch + pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.62.10
      # Applies every migration to an empty database, then runs supabase/tests/database.
      - run: supabase db start
      - run: supabase test db

  e2e:
    name: End-to-end (Firebase emulator)
    needs: web
    runs-on: ubuntu-latest
    env:
      TEST_ACCOUNT_EMAIL: ${{ secrets.TEST_ACCOUNT_EMAIL }}
      TEST_ACCOUNT_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.21.0
      - run: npm ci
      - uses: actions/download-artifact@v7.0.0
        with:
          name: site
          path: dist/client
      - run: npx playwright install --with-deps chromium
      # Signed-out tests always run. Signed-in tests run when the test-account secrets exist; they
      # use the real Supabase project through the emulator-served build.
      - name: Playwright
        run: |
          npx -y firebase-tools@15.33.0 emulators:exec --only hosting --project demo-ci "npx playwright test"
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
